# All backend services (RAG, Image, Guardrails, LangGraph)
# Usage: docker compose -f docker-compose.backend.yml up --build -d
# Requires trained weights: see docs/IMAGE_MODEL_TRAINING.md and GitHub Release image-model-v1

services:
  rag_service:
    build:
      context: ./services
      dockerfile: rag_service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      CHROMA_DIR: /data/chroma
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      GGUF_MODEL_PATH: ${GGUF_MODEL_PATH:-/models/qwen2.5-1.5b-instruct-q4_k_m.gguf}
      TOP_K: ${TOP_K:-3}
    volumes:
      - rag_chroma_data:/data/chroma
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 20s
      timeout: 15s
      retries: 8
      start_period: 180s
    restart: unless-stopped

  guardrails_service:
    build:
      context: ./services
      dockerfile: guardrails_service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      USE_NEMO_GUARDRAILS: ${USE_NEMO_GUARDRAILS:-false}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
   
  image_analyser_service:
    build:
      context: ./services
      dockerfile: image_analyser_service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      MODEL_CHECKPOINT_PATH: ${MODEL_CHECKPOINT_PATH:-/app/checkpoints/property_room_model.pt}
      MOCK_INFERENCE: ${MOCK_INFERENCE:-true}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.5}
    volumes:
      - ./services/image_analyser_service/checkpoints:/app/checkpoints:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  langgraph_agent_service:
    build:
      context: ./services
      dockerfile: langgraph_agent_service/Dockerfile
    ports:
      - "8004:8004"
    environment:
      RAG_SERVICE_URL: http://rag_service:8001
      IMAGE_ANALYSER_URL: http://image_analyser_service:8002
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-30}
      HTTP_RETRIES: ${HTTP_RETRIES:-2}
    depends_on:
      rag_service:
        condition: service_started
      image_analyser_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
volumes:
  rag_chroma_data:
